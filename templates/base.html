<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- SEO Title -->
    <title>Clear Edge Technology | IT Solutions & Software Development</title>

    <!-- SEO Description -->
    <meta name="description"
          content="ClearEdge Technology provides Software Testing, QA Automation, Performance Testing, Web Development, Mobile App Development, and IT Consulting services.">

    <!-- SEO Keywords -->
    <meta name="keywords"
          content="software testing, QA automation, selenium testing, playwright testing, performance testing, web development, mobile app development, IT consulting">

    <meta name="author" content="ClearEdge Technology">
    <meta name="robots" content="index, follow">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://clearedgetechnology.com/">

    <!-- Favicon -->
    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='assets/favicon.png') }}">

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:title"
          content="ClearEdge Technology | Software Testing, QA Automation & Development Services">

    <meta property="og:description"
          content="Software Testing, QA Automation, Performance Testing, Web Development, Mobile App Development and IT Consulting Services.">

    <meta property="og:image"
          content="https://clearedgetechnology.com/static/assets/logo.png">

    <meta property="og:url"
          content="https://clearedgetechnology.com">

    <meta property="og:site_name" content="ClearEdge Technology">

    <meta property="og:type" content="website">

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title"
          content="ClearEdge Technology">
    <meta name="twitter:description"
          content="Software Testing, QA Automation, Development & IT Consulting Services">
    <meta name="twitter:image"
          content="https://clearedgetechnology.com/static/assets/logo.png">

    <!-- Structured Data for Google -->
    <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "ClearEdge Technology",
          "url": "https://clearedgetechnology.com/",
          "logo": "https://clearedgetechnology.com/static/assets/logo.png",
          "description": "Software Testing, QA Automation, Performance Testing, Web Development and IT Consulting Services",
          "email": "info@clearedgetechnology.com",
          "sameAs": [
            "https://www.linkedin.com/company/110503087/"
          ]
        }
    </script>

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="/">
      <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="ClearEdge" />
    </a>

    <!-- MOBILE MENU BUTTON -->
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>

    <nav class="nav" id="navMenu">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/services">Services</a>
      <a href="/portfolio">Portfolio</a>
      <a href="/leaderboard">LeaderShip</a>

      <!-- BLOG DROPDOWN -->
      <div class="dropdown">
        <a class="dropdown-toggle">Blog ▾</a>
        <div class="dropdown-menu">
          <a href="/blog">Blogs</a>
        </div>
      </div>

      <a class="btn" href="/contact">Contact</a>
    </nav>
  </div>
</header>


<main class="container">
  {% block content %}
  {% endblock %}
</main>

<footer class="footer">
  <div class="container footer-inner">
    <div>
      <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="ClearEdge" class="footer-logo" />
      <p>ClearEdge Technologies — Delivering high-quality software and QA services.</p>
    </div>
    <div class="footer-links">
      <a href="services">Services</a>
      <a href="portfolio">Portfolio</a>
      <a href="contact">Contact</a>
      <a href="https://www.linkedin.com/company/110503087/admin/dashboard/">Linkedin</a>
    </div>
    <div>
      <p>© <span id="year"></span> ClearEdge Technologies</p>
    </div>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script> document.getElementById('year').textContent = new Date().getFullYear(); </script>

</body>
</html>
